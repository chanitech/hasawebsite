---
deployment:
  tasks:
    # Recreate the public/storage symlink if the checkout lost it.
    - /bin/bash -lc 'cd /home/hasaconstruction/repositories/hasawebsite && [ -e public/storage ] || ln -s ../storage/app/public public/storage'

    # Writable dirs for the web server.
    - /bin/bash -lc 'cd /home/hasaconstruction/repositories/hasawebsite && chmod -R 775 storage bootstrap/cache'

    # Run migrations. Requires .env to already hold valid DB credentials.
    - /bin/bash -lc 'cd /home/hasaconstruction/repositories/hasawebsite && PHPBIN=$(command -v php || echo /opt/cpanel/ea-php82/root/usr/bin/php); [ -x "$PHPBIN" ] || PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php; echo "Using PHP: $PHPBIN"; $PHPBIN artisan migrate --force'

    # Rebuild caches against the deployed code.
    - /bin/bash -lc 'cd /home/hasaconstruction/repositories/hasawebsite && PHPBIN=$(command -v php || echo /opt/cpanel/ea-php82/root/usr/bin/php); [ -x "$PHPBIN" ] || PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php; $PHPBIN artisan config:cache && $PHPBIN artisan route:cache && $PHPBIN artisan view:cache'

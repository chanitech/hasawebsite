<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0a15"/>
      <stop offset="50%" stop-color="#013660"/>
      <stop offset="100%" stop-color="#012544"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="900" fill="url(#bg2)"/>

  <!-- Diagonal stripes echoing the logo, left side -->
  <g opacity="0.45">
    <polygon points="120,900 260,900 560,150 420,150" fill="#ffffff" fill-opacity="0.08"/>
    <polygon points="300,900 440,900 740,150 600,150" fill="#ffffff" fill-opacity="0.10"/>
    <polygon points="480,900 620,900 920,150 780,150" fill="#888888" fill-opacity="0.18"/>
  </g>

  <!-- Road receding into distance -->
  <g opacity="0.5">
    <polygon points="700,900 1220,900 1030,420 900,420" fill="#0a1a26" fill-opacity="0.6"/>
    <line x1="960" y1="880" x2="945" y2="470" stroke="#ffffff" stroke-opacity="0.5" stroke-width="6" stroke-dasharray="30 24"/>
  </g>

  <!-- Building blocks skyline, right -->
  <g fill="#000000" opacity="0.22">
    <rect x="1350" y="520" width="100" height="380"/>
    <rect x="1470" y="440" width="80" height="460"/>
    <rect x="1570" y="600" width="120" height="300"/>
    <rect x="1710" y="500" width="90" height="400"/>
    <rect x="1820" y="620" width="70" height="280"/>
  </g>

  <circle cx="260" cy="170" r="60" fill="#888888" opacity="0.18"/>
</svg>
